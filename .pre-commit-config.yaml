repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^data/.*\.yml$
      - id: end-of-file-fixer
        files: ^data/.*\.yml$
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint]
        files: ^data/.*\.yml$
  - repo: local
    hooks:
      - id: validate-intentions
        name: data properties are in the intentions list
        entry: python scripts/validate_intentions.py
        language: python
        additional_dependencies: [pyyaml]
        files: ^(data/.*\.yml|scripts/.*\.py)$
        pass_filenames: false
