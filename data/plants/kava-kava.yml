kava-kava:
  planet: saturn
  element: water
  properties:
    - clairvoyance
    - protection
    - attract luck
  notes:
    - it is drunk as an infusion but too much can cause kidney damage
  toxicity:
    notes:
      - avoid if pregnant
      - avoid if nursing
      - may cause Parkinson's disease
      - do not take internally in high doses; find several sources that have appropriate doses of this herb
      - do not take for more than 2 months at a time
      - use water-based extracts
      - take on professional advice with a history of liver disease
      - restricted in many countries
  medicinal:
    parts used: root
    key constituents:
      - resin containing kava lactones including kawain
      - piperidine alkaloid pipermethysticine
    key actions:
      - tonic
      - reduces anxiety
      - urinary antiseptic
      - analgesic
      - induces sleep
    uses:
      - anxiety
      - muscle tension
      - insomnia
      - chronic pain
      - gout and arthritis
      - cystitis and urethritis
      - sore throats
      - toothache and mouth ulcers
    preparations:
      - tablets
      - infusion
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
