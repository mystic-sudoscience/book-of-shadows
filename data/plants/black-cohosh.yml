black cohosh:
  type: misc
  parts used: root
  planet: pluto
  element: fire
  moon phase: waxing, waning
  zodiac sign: scorpio
  chakra: root
  properties:
    - balance
    - banish
    - calm
    - courage
    - fertility
    - life
    - love
    - lust
    - money
    - obstacles
    - pregnancy/childbirth
    - protection
    - sexual energy
    - sexuality
    - shyness
    - strength
    - stress
    - virility
    - well-being
  toxicity:
    humans: true
    pets: true
    notes:
      - nontoxic in small amounts
      - avoid if pregnant
      - avoid if nursing
      - large doses can cause stomach upset and headache
  medicinal:
    parts used: root
    key constituents:
      - triterpene glycosides including actein and cimicifugoside
      - isoflavones including formononetin
      - isoferulic acid
    key actions:
      - anti-inflammatory
      - sedative
      - antirheumatic
      - estrogenic
      - expectorant
    uses:
      - menopausal symptoms and hot flashes
      - period pain
      - low estrogen
      - inflammatory arthritis
      - rheumatism
      - high blood pressure
      - tinnitus
      - whooping cough
      - asthma
    preparations:
      - decoction
      - tablets
      - tincture
  citation:
    - morgana-green-witch
    - cunningham-herbs
    - kynes-correspondences
    - chevallier-herbal-medicine
