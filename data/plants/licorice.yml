licorice:
  planet: venus
  element: water
  properties:
    - lust
    - love
    - fidelity
  toxicity:
    notes:
      - avoid if pregnant
      - may cause kidney problems
      - may cause liver problems
      - may cause hypertension
      - may cause diabetes
      - may cause hypokalemia
      - do not abuse, internally; not for long-term use
      - do not take internally in high doses; find several sources that have appropriate doses of this herb
      - may deplete potassium
      - excessive doses can cause high blood pressure
      - avoid large doses with high blood pressure
      - take on professional advice if pregnant or for long-term use
  medicinal:
    parts used: root
    key constituents:
      - triterpene saponins including glycyrrhizin
      - isoflavones including liquiritin, isoliquiritin, and formononetin
      - polysaccharides
      - phytosterols
    key actions:
      - anti-inflammatory
      - expectorant
      - demulcent
      - adrenal agent
      - mild laxative
    uses:
      - canker sores
      - gastritis
      - peptic ulcers
      - excess stomach acid
      - coughs and bronchitis
      - asthma
      - arthritis and inflamed joints
      - inflamed eyes
      - menopausal hot flashes
      - addison's disease
      - constipation
      - oral thrush
      - loss of appetite and vomiting
    preparations:
      - dried juice stick
      - powder
      - tincture
      - decoction
      - fluid extract
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
