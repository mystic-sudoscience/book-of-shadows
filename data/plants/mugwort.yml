mugwort:
  type: herb & garden
  parts used: leaves, flowers
  planet: venus
  element: earth, air
  moon phase: full
  zodiac sign: cancer, gemini, libra, sagittarius
  chakra: third eye
  properties:
    - astral realm
    - authority
    - awareness
    - banish
    - beginnings
    - blessings
    - community
    - consecrate/bless
    - defense
    - divination
    - dream work
    - empathy
    - face danger
    - fertility
    - guidance
    - healing
    - love
    - magic
    - messages/omens
