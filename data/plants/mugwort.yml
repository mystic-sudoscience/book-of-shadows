  medicinal:
    parts used: leaves, root
    key constituents:
      - volatile oil, mainly caryophyllene
      - sesquiterpene lactone
      - flavonoids
      - coumarin derivatives
      - triterpenes
    key actions:
      - digestive tonic
      - increases bile flow
      - mildly promotes menstruation
      - antiseptic
      - expels worms
