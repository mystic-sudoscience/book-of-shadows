horsetail:
  parts used: leaves, stalk
  planet: saturn
  element: earth
  moon phase: full
  zodiac sign: taurus
  chakra: sacral
  properties:
    - fertility
  toxicity:
    humans: false
    pets: false
    notes:
      - may cause renal disorders
      - may cause cardiac dysfunction
      - breaks down vitamin b1
      - take long term only with a b vitamin supplement
  medicinal:
    parts used: aerial parts
    key constituents:
      - silicic acid and silicates
      - flavonoids
      - phenolic acids
      - alkaloids including nicotine
      - sterols
    key actions:
      - astringent
      - diuretic
      - stops bleeding
      - repairs connective tissue
    uses:
      - wounds and nosebleeds
      - bleeding in the urinary tract
      - cystitis and urethritis
      - prostate disease
      - rheumatic and arthritic problems
      - emphysema
      - chronic leg swelling
      - slow-healing sprains and fractures
      - eczema
    preparations:
      - decoction
  citation:
    - morgana-green-witch
    - cunningham-herbs
    - chevallier-herbal-medicine
