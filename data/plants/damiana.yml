damiana:
  planet: mars
  element: fire
  properties:
    - love
    - lust
    - clairvoyance
  medicinal:
    parts used: leaves
    key constituents:
      - volatile oil including caryophyllene, thymol, and cadinene
      - flavonoids
      - hydroquinones including arbutin
      - tannins
    key actions:
      - tonic
      - nerve tonic
      - aphrodisiac
      - mild stimulant
      - mild antidepressant
      - mild laxative
      - mild diuretic
    uses:
      - mild to moderate depression
      - nervous exhaustion
      - anxiety with depression
      - impotence and premature ejaculation
      - painful or delayed periods
      - menstrual headaches
      - cystitis and urethritis
      - constipation
    preparations:
      - tincture
      - tablets
      - infusion
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
