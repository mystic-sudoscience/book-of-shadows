althea:
  parts used: roots, leaves, flowers
  element: water
  properties:
    - protection
    - attraction
  notes:
    - known as marshmallow
  medicinal:
    parts used: root, leaves, flowers
    key constituents:
      - starch
      - mucilage
      - pectin
      - flavonoids
      - phenolic acids
      - sucrose
      - asparagine
    key actions:
      - demulcent
      - mild laxative
    uses:
      - excess stomach acid and gastritis
      - peptic ulcers
      - colitis and diverticulitis
      - irritable bowel syndrome
      - cystitis and frequent urination
      - dry coughs and bronchitis
      - bronchial asthma
      - inflamed skin
      - boils and abscesses
      - teething
      - allergic rhinitis with mucus
    preparations:
      - infusion of flowers
      - ointment of root
      - mouthwash
      - peeled root
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
