lobelia:
  planet: saturn, neptune
  element: water
  zodiac sign: gemini
  properties:
    - storms
    - love
    - banish
    - protection
    - communicate with spirits
    - fairy magic
    - purification
    - dream work
  toxicity:
    humans: true
    notes:
      - poison
      - avoid if pregnant
      - do not take internally in high doses; find several sources that have appropriate doses of this herb
      - take only when prescribed by a medical herbalist or doctor
      - do not eat the fresh plant
      - excessive ingestion can be fatal
      - restricted in some countries
  notes:
    - also known as indian tobacco, pukeweed, gagroot.
  medicinal:
    parts used: aerial parts
    key constituents:
      - piperidine alkaloids, principally lobeline
      - carboxylic acids
    key actions:
      - respiratory stimulant
      - antispasmodic
      - expectorant
      - induces vomiting
      - increases sweating
      - traditionally used to support respiratory conditions such as asthma
      - bronchitis
      - pneumonia
      - and cough
    uses:
      - bronchial asthma
      - chronic bronchitis
      - sprains
      - back problems from muscle tension
      - quitting smoking
    preparations:
      - infusion
      - tincture
      - tablets
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
    - riteofritual-apothecary
