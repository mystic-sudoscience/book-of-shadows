aconite:
  parts used: leaves, flowers
  planet: saturn
  element: water
  moon phase: waning
  zodiac sign: scorpio
  chakra: root
  properties:
    - consecrate/bless
    - invisibility
    - protection
  toxicity:
    humans: true
    pets: true
    notes:
      - avoid touching with bare skin; always wear gloves when handling
      - highly toxic
      - use only under professional supervision
      - restricted in some countries
  holidays:
    - samhain
  medicinal:
    parts used: root
    key constituents:
      - terpenoid alkaloids, principally aconitine
    key actions:
      - analgesic
      - sedative
    uses:
      - pain from bruises applied to unbroken skin
      - neuralgia
      - asthma
      - heart weakness
  citation:
    - morgana-green-witch
    - chevallier-herbal-medicine
