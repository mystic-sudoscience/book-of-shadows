aloe:
  type: misc
  parts used: leaves, root
  planet: moon, venus
  element: water
  moon phase: full
  zodiac sign: scorpio, pisces, cancer
  chakra: heart, third eye
  properties:
    - protection
    - afterlife
    - attract luck
    - beauty
    - friendship
    - grief
    - harmony
    - healing
    - love
    - mental balance
    - peace
    - purification
    - security
    - stress
    - support
    - virility
  toxicity:
    humans: false
    pets: true
    notes:
      - mild to moderately toxic to pets
      - do not apply bitter aloes to the skin
      - avoid internally if pregnant or nursing
      - do not take internally with hemorrhoids or kidney disease
      - bitter aloes restricted in some countries
  medicinal:
    parts used: leaves, gel, dried leaf sap
    key constituents:
      - anthraquinones including aloin and aloe-emodin
      - resins
      - tannins
      - polysaccharides
      - aloectin b
    key actions:
      - heals wounds
      - emollient
      - stimulates bile secretion
      - laxative
    uses:
      - burns and sunburn
      - scrapes and scalds
      - wounds
      - eczema
      - soothing skin conditions
      - peptic ulcers
      - irritable bowel syndrome
      - constipation
      - stretch marks
      - warts
    preparations:
      - fresh gel
      - juice
      - tincture
      - bitter aloes
  citation:
    - morgana-green-witch
    - kynes-correspondences
    - chevallier-herbal-medicine
