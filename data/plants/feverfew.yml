feverfew:
  type: herb & garden
  parts used: flowers, leaves
  planet: venus
  element: fire
  moon phase: waning
  zodiac sign: sagittarius
  chakra: solar plexus
  properties:
    - banish
    - emotions
    - healing
    - heartbreak
    - love
    - protection
    - purification
    - strength
    - warmth
  notes: null
  toxicity:
    notes:
      - avoid if pregnant
      - may disturb some part of the digestive system if used internally
      - eating fresh leaves may cause mouth ulcers
      - do not take with blood-thinning drugs
      - may cause allergic reaction in rare cases
  medicinal:
    parts used: aerial parts, leaves
    key constituents:
      - volatile oil including alpha-pinene
      - sesquiterpene lactones including parthenolide
      - sesquiterpenes including camphor
    key actions:
      - anti-inflammatory
      - analgesic
      - reduces fever
      - antirheumatic
      - promotes menstrual flow
    uses:
      - migraine prevention
      - headaches
      - fevers
      - arthritis and rheumatic pain
      - inducing menstruation
    preparations:
      - fresh leaves
      - tincture
      - capsules
      - tablets
  citation:
