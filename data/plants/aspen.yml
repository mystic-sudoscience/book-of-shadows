aspen:
  type: tree
  parts used: leaves, bark
  planet: mercury
  element: air
  properties:
    - anxiety
    - astral realm
    - break hexes
    - communication
    - control senses
    - courage
    - determination
    - divination
    - eloquence
    - enchantment
    - endurance
    - fear
    - harmony
    - healing
    - knowledge
    - money
    - otherworld/underworld
    - peace
    - protection from theft
    - rebirth/renewal
    - sensitivity
    - skills
    - stress
    - success
    - well-being
  notes:
    - see poplar
  toxicity:
    notes:
      - do not take if allergic to aspirin
  medicinal:
    parts used: bark
    key constituents:
      - phenolic glycosides including salicin and populin
      - tannins
    key actions:
      - anti-inflammatory
      - analgesic
      - reduces fever
      - astringent
      - antiseptic
      - tonic
    uses:
      - arthritic and rheumatic pain
      - fever
      - anorexia and debility
      - diarrhea
      - irritable bowel syndrome
      - urinary tract infections
  citation:
    - cunningham-herbs
