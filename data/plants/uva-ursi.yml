uva ursi:
  parts used: leaves, flowers, branches
  planet: saturn
  element: earth
  moon phase: full
  zodiac sign: scorpio
  chakra: third eye
  properties:
    - psychic ability
  toxicity:
    humans: true
    pets: true
    notes:
      - nontoxic in small amounts
      - avoid if pregnant
      - may cause kidney problems
      - may disturb some part of the digestive system if used internally
      - this herb is known as a gi irritant
      - may cause acidic urine
      - do not take with kidney disease
      - not suitable for children under 12
      - do not take for more than 7 to 10 days at a time
  medicinal:
    parts used: leaves, berries
    key constituents:
      - hydroquinones, mainly arbutin
      - tannins
      - phenolic glycosides
      - flavonoids
    key actions:
      - urinary antiseptic
      - astringent
      - antibacterial
    uses:
      - acute and chronic cystitis
      - urethritis
  citation:
    - morgana-green-witch
    - cunningham-herbs
    - chevallier-herbal-medicine
