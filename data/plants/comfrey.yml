comfrey:
  type: herb & garden
  parts used: flowers, leaves, root
  planet: saturn
  element: water
  moon phase: waxing
  zodiac sign: libra
  chakra: root
  properties:
    - astral realm
    - balance
    - banish
    - bind
    - discipline
    - dream work
    - endings
    - endurance
    - enmity
    - healing
    - loss
    - memory/memories
    - money
    - prosperity
    - protection
    - protection during travel
    - psychic ability
    - release attachments
    - stability
    - stimulation
    - strength
    - stress
    - travel
    - unity
  notes:
