mace:
  planet: mercury
  element: air
  properties:
    - psychic ability
    - mental power
  toxicity:
    notes:
      - do not take internally in high doses; find several sources that have appropriate doses of this herb
      - not recommended for internal use
      - take essential oil internally only under professional supervision
      - toxic in excess
      - avoid if pregnant
  medicinal:
    parts used: aril
    key constituents:
      - volatile oil similar to nutmeg but higher in myristicin
    key actions:
      - stimulant
      - carminative
    uses:
      - gas and bloating
      - digestive problems
    preparations:
      - powder
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
