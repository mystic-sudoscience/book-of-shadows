nutmeg:
  planet: jupiter, moon
  element: fire
  zodiac sign: leo, sagittarius
  chakra: solar plexus, heart
  properties:
    - abundance
    - beauty
    - clairvoyance
    - divination
    - dream work
    - energy
    - fidelity
    - healing
    - justice
    - life
    - love
    - luck
    - money
    - prosperity
    - psychic ability
