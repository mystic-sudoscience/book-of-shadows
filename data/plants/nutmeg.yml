nutmeg:
  planet: jupiter
  element: fire
  properties:
    - authority
    - avoid danger
    - awareness
    - beauty
    - beginnings
    - calm
    - clairvoyance
    - concentration/focus
    - divination
    - dream work
    - enchantment
    - energy
    - fidelity
    - healing
    - increase
    - justice
    - life
    - love
    - luck
    - memory/memories
    - mind
    - money
    - power
    - prosperity
    - psychic ability
    - sleep
    - stimulation
    - wealth
    - well-being
  toxicity:
    notes:
      - do not take internally in high doses; find several sources that have appropriate doses of this herb
      - not recommended for internal use
      - take essential oil internally only under professional supervision
      - toxic and hallucinogenic in excess
      - avoid if pregnant
  medicinal:
    parts used: seed kernel, fixed oil, essential oil
    key constituents:
      - volatile oil including pinenes, terpinenes, myristicin, elemicin, and safrole
      - fixed oil known as nutmeg butter
    key actions:
      - carminative
      - relieves muscle spasms
      - prevents vomiting
      - stimulant
    uses:
      - gastroenteritis
      - nausea, vomiting, and diarrhea
      - low appetite
      - sleep problems
      - aphrodisiac
      - rheumatic conditions
      - eczema and ringworm
    preparations:
      - grated nutmeg
      - infusion
      - essential oil
      - ointment
  citation:
    - cunningham-herbs
    - kynes-correspondences
    - chevallier-herbal-medicine
