camphor:
  planet: moon
  element: water
  properties:
    - subdue passion
    - healing
    - divination
  toxicity:
    notes:
      - not recommended for internal use
      - do not use in the faces of small children
      - do not take internally
      - restricted in some countries
  medicinal:
    parts used: stems, root, wood, leaves, twigs, volatile oil
    key constituents:
      - volatile oil with camphor, safrole, eugenol, and terpineol
      - lignans
    key actions:
      - antiseptic
      - counterirritant
      - analgesic
      - stimulant
      - antispasmodic
    uses:
      - arthritic and rheumatic pain
      - neuralgia
      - back pain
      - cold sores
      - chilblains
      - bronchitis and chest infections
    preparations:
      - liniment
      - chest rub
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
