horseradish:
  planet: mars
  element: fire
  properties:
    - purification
    - banish
  toxicity:
    notes:
      - may cause kidney problems
      - may cause gastric mucosa inflammation
      - avoid if a child under 4
      - not recommended for internal use above normal food use levels
      - overuse may irritate the gastrointestinal tract
      - avoid with low thyroid function
      - poultice may cause blistering
  medicinal:
    parts used: root, leaves
    key constituents:
      - glucosinolates, mainly sinigrin
      - flavonoids
      - asparagine
      - resin
      - vitamin c
    key actions:
      - digestive stimulant
      - diuretic
      - promotes sweating
      - expectorant
      - mild antibiotic
    uses:
      - poor appetite and digestion
      - fevers, colds, and flu
      - respiratory infections
      - urinary tract infections
      - hay fever
      - chilblains
    preparations:
      - fresh grated root
      - poultice
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
