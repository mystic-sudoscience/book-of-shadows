coltsfoot:
  planet: venus
  element: water
  properties:
    - animal magic
    - clairvoyance
    - healing
    - justice
    - love
    - negativity
    - peace
    - power
    - protection
    - psychic ability
  toxicity:
    notes:
      - avoid if pregnant
      - avoid if nursing
      - not recommended for internal use
      - do not use the flowers
      - do not take leaves for more than 3 to 4 weeks at a time
      - not suitable for children under 6
      - restricted in some countries
  medicinal:
    parts used: leaves, flowers
    key constituents:
      - flavonoids
      - mucilage
      - tannins
      - pyrrolizidine alkaloids
      - vitamin c
      - zinc
    key actions:
      - demulcent
      - expectorant
      - anti-inflammatory
      - antispasmodic
      - immunostimulant
    uses:
      - chest problems
      - asthma
      - spasmodic coughs
    preparations:
      - decoction
      - syrup
  citation:
    - cunningham-herbs
    - kynes-correspondences
    - chevallier-herbal-medicine
