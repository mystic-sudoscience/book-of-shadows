buckthorn:
  planet: saturn
  element: water
  properties:
    - protection
    - banish
    - wishes
    - legal matters
  toxicity:
    notes:
      - avoid if pregnant
      - avoid if nursing
      - do not abuse, internally; not for long-term use
      - avoid with intestinal obstruction
      - avoid with abdominal pain
      - avoid with any inflammation of the intestines
      - avoid if a child under 12
      - r. frangula bark must be aged two years prior to internal use
      - fresh bark is violently purgative
      - use only bark dried and stored for at least a year
      - berries may be harmful if eaten
  medicinal:
    parts used: dried bark
    key constituents:
      - anthraquinones including frangulin and emodin
      - anthrones and anthranols
      - alkaloid armepavine
      - tannins
      - flavonoids
    key actions:
      - laxative
      - cathartic
    uses:
      - chronic constipation
      - poor bile flow
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
