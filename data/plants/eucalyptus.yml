eucalyptus:
  planet: moon
  element: water
  properties:
    - healing
    - protection
  toxicity:
    notes:
      - may cause liver problems
      - may cause inflammatory diseases of bile ducts
      - do not use on the faces of small children
      - do not take essential oil internally except under professional supervision
      - do not give to small children or infants
  medicinal:
    parts used: leaves, essential oil
    key constituents:
      - volatile oil with cineole
      - flavonoids
      - tannins
      - resin
    key actions:
      - antiseptic
      - analgesic
      - expectorant
      - stimulates local blood flow
      - insect repellent
    uses:
      - colds and flu
      - sore throats
      - fevers and infections
      - coughs and bronchitis
      - chest infections
      - sinus congestion and earache
      - rheumatic joints
      - neuralgia
    preparations:
      - lozenges
      - inhalation
      - capsules
      - essential oil
      - infusion
      - tincture
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
