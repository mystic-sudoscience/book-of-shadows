allspice:
  type: misc
  parts used: berries
  planet: mars
  element: Fire
  properties:
    - attract luck
    - attraction
    - business
    - collect debts
    - communication
    - compassion
    - consecrate/bless
    - courage
    - determination
    - energy
    - fear
    - friendship
    - healing
    - kindness
    - money
    - power
    - prosperity
    - spirituality
    - strength
    - stress
    - success
    - willpower
  toxicity:
    notes:
      - do not take essential oil internally without professional guidance
      - avoid as a medicine if pregnant
  medicinal:
    parts used: berries, leaves, essential oil
    key constituents:
      - volatile oil, mostly eugenol
      - lignins
      - terpenoids
    key actions:
      - digestive stimulant
      - carminative
      - antiseptic
      - analgesic
      - estrogenic
    uses:
      - flatulence and indigestion
      - diarrhea
      - menopausal symptoms
      - high blood pressure
  citation:
    - cunningham-herbs
    - kynes-correspondences
    - chevallier-herbal-medicine
