juniper:
  type: tree
  parts used: leaves, wood, berries
  planet: sun, jupiter
  element: fire
  moon phase: waning
  zodiac sign: sagittarius
  chakra: root, throat, third eye
  properties:
    - banish
    - calm
    - community
    - energy
    - healing
    - love
    - negativity
    - prosperity
    - protection
    - psychic ability
    - purification
    - security
    - sight
    - spiritual purification
    - well-being
    - exorcism
    - clarity
    - manifestation
  toxicity:
    humans: true
    pets: true
    notes:
      - humans: nontoxic in small amounts
      - avoid if pregnant
      - do not abuse, internally; not for long-term use (maximum of 4-6 weeks at a time)
      - avoid if prone to heavy menstrual bleeding
      - do not take with kidney infection or kidney disease
      - do not take essential oil internally except under professional supervision
  holidays:
