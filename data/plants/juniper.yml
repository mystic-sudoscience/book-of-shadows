  medicinal:
    parts used: fruit, essential oil
    key constituents:
      - volatile oil with myrcene, sabinene, pinenes, and cineole
      - tannins
      - diterpenes
      - sugars
      - resin
      - vitamin c
    key actions:
      - tonic
      - diuretic
      - urinary antiseptic
      - warming
      - promotes menstruation
      - anti-inflammatory
      - antioxidant
      - antidiabetic
      - antibacterial
    uses:
      - cystitis and urinary infections
      - fluid retention
      - colic
      - chronic arthritis, gout, and rheumatism
    preparations:
      - essential oil
  citation:
    - morgana-green-witch
