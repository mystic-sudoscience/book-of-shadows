asafoetida:
  type: misc
  planet: mars
  element: fire
  properties:
    - assertiveness
    - banish
    - black magic
    - calm
    - healing
    - protection
    - purification
    - set hexes
    - smell
    - spirits
  toxicity:
    notes:
      - avoid if pregnant
      - do not feed to a child with colic
      - may be harmful to young babies
  medicinal:
    parts used: oleo-gum-resin
    key constituents:
      - volatile oil with disulphides
      - resin with sesquiterpenoid coumarins including foetidin
      - gum
    key actions:
      - carminative
      - expectorant
      - lowers blood pressure
      - thins the blood
    uses:
      - gas and bloating
      - indigestion and constipation
      - bronchitis
      - bronchial asthma
      - whooping cough
      - neurotic states
    preparations:
      - tablets
  citation:
    - cunningham-herbs
    - kynes-correspondences
    - chevallier-herbal-medicine
