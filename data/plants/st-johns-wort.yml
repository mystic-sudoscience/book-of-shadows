      - anxiolytic
      - antiviral
      - wound healer
      - anti-inflammatory
    uses:
      - mild to moderate depression
      - nervous exhaustion
      - anxiety and tension
      - seasonal affective disorder
      - low mood during menopause
      - minor wounds and burns
      - neuralgia, shingles, and sciatica
      - cold sores and chicken pox
      - back pain
      - stiff joints and aching muscles
