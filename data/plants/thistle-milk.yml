thistle, milk:
  planet: mars
  element: fire
  properties:
    - provoke anger
  notes:
    - per cunningham, enrages snakes
  toxicity:
    notes:
      - may cause allergic reaction in rare cases
      - seek professional advice before taking alongside chemotherapy
  medicinal:
    parts used: seeds, flower heads
    key constituents:
      - flavonolignans known as silymarin
      - bitter principles
      - polyacetylenes
    key actions:
      - liver protective
      - chemoprotective
      - anticancer
      - anti-allergenic
      - increases breast-milk production
    uses:
      - liver disorders
      - hepatitis and jaundice
      - liver cirrhosis
      - alcohol-related liver stress
      - liver support during chemotherapy
      - hangover
      - hay fever
      - depression
    preparations:
      - decoction
      - tincture
      - capsules
      - tablets
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
