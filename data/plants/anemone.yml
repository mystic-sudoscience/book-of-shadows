anemone:
  type: herb & garden
  parts used: flowers
  planet: mars
  element: fire
  properties:
    - beauty
    - beginnings
    - calm
    - community
    - endurance
    - energy
    - friendship
    - grief
    - harmony
    - healing
    - innocence
    - karma
    - loss
    - protection
    - well-being
  toxicity:
    notes:
      - not recommended for internal use
      - take only under professional supervision
      - avoid if pregnant
      - fresh plant is toxic
  medicinal:
    parts used: dried aerial parts
    key constituents:
      - protoanemonin which forms anemonin on drying
      - triterpenoid saponins
      - tannins
      - volatile oil
    key actions:
      - antispasmodic
      - sedative
    uses:
      - cramping pain
      - premenstrual syndrome and period pain
      - reproductive system spasms
      - emotional distress and nervous exhaustion
      - coughs
      - sleep difficulties
      - cataracts
  citation:
    - cunningham-herbs
    - kynes-correspondences
    - chevallier-herbal-medicine
