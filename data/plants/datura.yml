    key constituents:
      - tropane alkaloids including hyoscyamine and hyoscine
      - flavonoids
      - steroidal lactones
      - withanolides
      - coumarins
      - tannins
    key actions:
      - antispasmodic
      - reduces secretions
    uses:
      - asthma
      - whooping cough
      - muscle spasms
      - parkinsonism
      - rheumatic pain and neuralgia
