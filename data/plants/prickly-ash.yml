prickly ash:
  planet: mars
  element: fire
  properties:
    - activate/awaken
    - amplification
    - break hexes
    - healing
    - love
    - protection
    - travel
  toxicity:
    notes:
      - avoid if pregnant
      - avoid if nursing
  notes:
    - also known as northern prickly ash, suterberry, yellow tree.
  medicinal:
    parts used: bark, berries
    key constituents:
      - isoquinoline alkaloids
      - furanocoumarins
      - lignans
      - volatile oil
      - tannins
    key actions:
      - circulatory stimulant
      - increases sweating
      - antirheumatic
      - antifungal
      - capillary circulation
      - anti-inflammatory
      - fever
      - diuretic
    uses:
      - arthritis and rheumatism
      - poor circulation
      - intermittent claudication
      - raynaud's disease
      - toothache
      - gas and diarrhea
      - leg ulcers
      - back pain
    preparations:
      - decoction
      - tincture
      - tablets
      - lotion
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
    - riteofritual-apothecary
