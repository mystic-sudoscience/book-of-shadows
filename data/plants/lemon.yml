lemon:
  planet: moon
  element: water
  properties:
    - life
    - purification
    - love
    - friendship
  toxicity:
    notes:
      - do not take essential oil internally except under professional supervision
  medicinal:
    parts used: fruit, peel, pith
    key constituents:
      - volatile oil with limonene, alpha-terpinene, pinenes, and citral
      - coumarins
      - bioflavonoids
      - vitamins a, b1, b2, b3, and c
      - mucilage
    key actions:
      - antiseptic
      - antirheumatic
      - antibacterial
      - antioxidant
      - reduces fever
    uses:
      - colds and flu
      - chest infections
      - sore throats
      - mouth ulcers and gingivitis
      - arteriosclerosis
      - varicose veins and weak capillaries
      - stomach acidity
      - arthritis, gout, and rheumatism
      - weak digestion
      - acne, athlete's foot, and warts
      - chilblains
      - insect stings
    preparations:
      - juice
      - essential oil
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
