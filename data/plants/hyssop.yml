hyssop:
  planet: jupiter
  element: fire
  properties:
    - purification
    - protection
  toxicity:
    notes:
      - avoid if pregnant
      - essential oil can induce epileptic seizures
      - use essential oil only under professional supervision
      - essential oil restricted in some countries
  medicinal:
    parts used: flowering tops, essential oil
    key constituents:
      - terpenes including marrubiin
      - volatile oil with camphor, pinocamphone, and beta-pinene
      - flavonoids
      - tannins
      - resin
    key actions:
      - expectorant
      - tonic
      - sedative
      - carminative
    uses:
      - bronchitis with excess mucus
      - respiratory infections
      - recovery after infection
      - asthma with mucus congestion
      - indigestion, gas, bloating, and colic
  citation:
    - cunningham-herbs
    - chevallier-herbal-medicine
