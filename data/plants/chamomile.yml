  toxicity:
    notes:
      - fresh plant can cause dermatitis
      - do not take essential oil internally except under professional supervision
      - take on professional advice if using blood-thinning medication
      - do not use essential oil externally if pregnant
  medicinal:
    parts used: flower heads
    key constituents:
      - volatile oil with proazulenes, farnesine, alpha-bisabolol, and spiroether
      - flavonoids
      - bitter glycosides including anthemic acid
      - coumarins
    key actions:
      - anti-inflammatory
      - antiallergenic
      - antispasmodic
      - relaxant
      - carminative
    uses:
      - indigestion and acidity
      - gastritis
      - gas, bloating, and colic
      - peptic ulcer
      - irritable bowel syndrome
      - crohn's disease
      - period pain
      - tense muscles
      - irritability
      - insomnia
      - hay fever and congestion
      - mild asthma
      - eczema and itchy skin
      - sore nipples
      - eyestrain
      - morning sickness
    preparations:
      - infusion
      - cream
      - ointment
      - essential oil
      - tincture
