blueberry:
  parts used: berries
  planet: moon, venus
  element: water, earth
  moon phase: full
  zodiac sign: cancer, pisces
  chakra: heart
  properties:
    - protection
  toxicity:
    notes:
      - take on professional advice if using anticoagulants or with a bleeding disorder
  medicinal:
    parts used: berries, leaves
    key constituents:
      - tannins
      - proanthocyanins
      - flavonoids
      - fruit acids
      - phenolic acids
      - pectin
      - vitamin b2, vitamin c, and carotene
    key actions:
      - circulatory tonic
      - antioxidant
      - anti-inflammatory
      - astringent
      - urinary antiseptic
    uses:
      - night vision and eye health
      - poor circulation
      - varicose veins and hemorrhoids
      - easy bruising
      - raynaud's disease
      - diarrhea and indigestion
      - mild constipation
      - cystitis
      - pre-diabetes
    preparations:
      - capsules
      - decoction
      - tablets
      - tincture
  citation:
    - morgana-green-witch
    - chevallier-herbal-medicine
