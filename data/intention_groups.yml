# Groups of related intentions (FIRST DRAFT, needs review).
#
# Each key is a broad intention; its list holds more specific intentions that
# belong under it. Picking the broad intention in the web app can then also
# show items listed only under one of the specific wordings, e.g. "love" also
# shows items whose properties say "attract love" or "true love".
#
# Rules (checked by scripts/validate_intentions.py):
#   - Keys and members must all be in scripts/intentions.py.
#   - An intention may sit in more than one group ("luck with money" is under
#     both luck and money).
#   - A member may be a group itself (magic -> angel magic -> angelic messages),
#     but there must be no loops.
#   - Intentions not mentioned here simply stand alone.
#
# Only specific wordings are folded in. Broad intentions that are distinct
# ideas in the sources (wealth vs money vs prosperity, fear vs anxiety) are
# left as separate groups even where they are related.

